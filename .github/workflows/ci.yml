name: CI
# Vérifie chaque PR avant fusion (la pipeline de déploiement ne tourne qu'après fusion sur main/dev).
# Le job « pr-build » est une vérification obligatoire de main (protection de branche).
on: pull_request

permissions:
  contents: read

jobs:
  pr-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci --ignore-scripts  # aucun script d'installation des paquets (SonarCloud githubactions:S6505)
      - run: npm run build
